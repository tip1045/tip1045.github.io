name: Apply mobile accordion layout
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile layout
        env:
          MOBILE_ADDON_B64: 
        run: |
          python3 -c "import os,base64,pathlib; p=pathlib.Path('index.html'); s=p.read_text(encoding='utf-8'); a=base64.b64decode(os.environ['MOBILE_ADDON_B64']).decode(); p.write_text(s if 'MOBILE_ACCORDION_V1' in s else s.replace('</body>',a+'\\n</body>'),encoding='utf-8')"
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve mobile navigation with collapsed topic accordions"
          git push
